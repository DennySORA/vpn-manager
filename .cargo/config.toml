[env]
# ts-rs writes the generated TypeScript contract here (cargo test -p vpn-domain).
TS_RS_EXPORT_DIR = { value = "web/src/api/generated", relative = true }

# A new release waits a day before the resolver takes it (Cargo 1.100; versions already in Cargo.lock stay), as
# pnpm does for the web UI: a compromised release is usually withdrawn within hours. One exact version sooner:
# `cargo update -p <crate> --precise <version>` with CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow.
[registry]
global-min-publish-age = "1 days"
