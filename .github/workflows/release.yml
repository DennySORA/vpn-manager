# Builds the installers of a release and attaches them to a DRAFT release for the pushed version
# tag (v<workspace version>). Publishing the draft is a person's decision; scripts/install.sh
# only sees published releases. A published release keeps its files: the workflow fails for a tag
# whose release is no longer a draft.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One installer per platform, built on that platform by scripts/package.sh:
#   vpn-installer-<version>-linux-x86_64     Ubuntu 22.04 (glibc 2.35 or newer at run time)
#   vpn-installer-<version>-linux-aarch64    Ubuntu 22.04 on Arm
#   vpn-installer-<version>-darwin-arm64     macOS 11 or newer, Apple silicon
#   vpn-installer-<version>-darwin-x86_64    macOS 11 or newer, Intel
# each with its .sha256, the notices of the third-party software inside it (.notices.txt) and, in
# a public repository, a build provenance attestation
# (`gh attestation verify <file> --repo <owner>/<repo>`).
#
# Actions are pinned to the commit of the release named beside them.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    # `bash -eo pipefail` instead of the default `bash -e`: a command that fails inside a pipeline
    # fails its step.
    shell: bash

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(awk -F'"' '/^\[workspace\.package\]/ { inside = 1 } inside && /^version/ { print $2; exit }' Cargo.toml)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} is not v${version}, the version in Cargo.toml"
            exit 1
          fi
      - name: Create the draft unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null); then
            # A re-pushed tag or a re-run may fill a draft again, never a published release.
            if [ "${draft}" != "true" ]; then
              echo "::error::release ${TAG} is already published; its files are not replaced"
              exit 1
            fi
          else
            gh release create "${TAG}" --draft --verify-tag --title "VPN Manager ${TAG#v}" \
              --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh\`"
          fi

  build:
    name: Installer (${{ matrix.runner }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          - macos-15-intel
    env:
      # C code built by the crates (SQLite, AWS-LC) targets this macOS, not the runner's.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Package
        id: package
        run: |
          scripts/package.sh | tee "${RUNNER_TEMP}/package.out"
          file=$(tail -n 1 "${RUNNER_TEMP}/package.out")
          test -f "${file}"
          test -f "${file}.sha256"
          test -s "${file}.notices.txt"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.package.outputs.file }}
        run: gh release upload "${TAG}" "${FILE}" "${FILE}.sha256" "${FILE}.notices.txt" --clobber
