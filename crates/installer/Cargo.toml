[package]
name = "vpn-installer"
description = "Installer: carries vpnd and vpnctl and installs, upgrades and removes VPN Manager as per-user services (launchd on macOS, systemd on Linux). Not part of the running system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "vpn-installer"
path = "src/main.rs"

[dependencies]
vpn-platform = { path = "../platform" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
time.workspace = true
# `--allow-client`: networks (CIDR).
ipnetwork.workspace = true
# An upgrade's backup of the control database: its SSH download log and history are scrubbed.
rusqlite.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
