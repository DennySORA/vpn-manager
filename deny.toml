# cargo-deny: the advisory, licence, ban and source gate for the Rust workspace (docs/development.md,
# 「靜態檢查」). Run with the repo-local tool: `target/tools/bin/cargo-deny --locked check` (install it with
# `cargo install cargo-deny --locked --root target/tools`). Duplicate versions are Clippy's gate
# (`clippy::multiple_crate_versions` with the reviewed list in clippy.toml), so `bans` does not repeat it.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails; an exception needs an entry
# here with the advisory ID and the reason it does not apply.
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
confidence-threshold = 0.93
# Permissive licences, plus CDLA-Permissive-2.0 (the Mozilla root list data in webpki-roots). The binaries' notices are written by scripts/third_party_notices.py.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

# GotaTun (ADR-0001, the WireGuard implementation) is MPL-2.0: file-level copyleft, used unmodified.
exceptions = [{ allow = ["MPL-2.0"], crate = "gotatun" }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# The workspace's locks come from `vpn-sync`, which adds the hand-over schedule parking_lot 0.13
# no longer has (crates/sync/src/lib.rs). No other crate may depend on that generation itself.
# GotaTun and tokio are on 0.12 for their own locks; when one of them moves, it is reviewed and
# named here.
deny = [{ crate = "parking_lot:>=0.13.0", wrappers = ["vpn-sync"] }]

# Executables (ELF, PE, Mach-O) in a crate's sources fail, and only the crates below may run a build
# script. Read on 2026-11-14: none reaches the network or runs a shell; they compile C (aws-lc-sys,
# libsqlite3-sys, ring), probe the compiler or the target (anyhow, proc-macro2, rustversion, libc,
# ...) or generate tables (icu_*, mime_guess, oid-registry); wasm-bindgen-shared runs `git rev-parse`
# and is built only for wasm targets. Named without versions, so an update needs no new entry; a
# crate that newly brings a build script fails until it is read and named here.
[bans.build]
executables = "deny"
allow-build-scripts = [
    "anyhow",
    "aws-lc-rs",
    "aws-lc-sys",
    "crossbeam-utils",
    "curve25519-dalek",
    "defmt",
    "defmt-macros",
    "eyre",
    "generic-array",
    "getrandom",
    "heapless",
    "httparse",
    "iana-time-zone-haiku",
    "icu_normalizer_data",
    "icu_properties_data",
    "jni",
    "jni-macros",
    "libc",
    "libsqlite3-sys",
    "memoffset",
    "mime_guess",
    "nix",
    "num-traits",
    "oid-registry",
    "parking_lot_core",
    "portable-atomic",
    "proc-macro2",
    "quote",
    "ring",
    "rustix",
    "rustls",
    "rustversion",
    "serde",
    "serde_core",
    "serde_json",
    "smoltcp",
    "sqlite-wasm-rs",
    "thiserror",
    "valuable",
    "wasm-bindgen",
    "wasm-bindgen-shared",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_gnullvm",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
    "wit-bindgen",
    "zerocopy",
    "zmij",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# A git source, if one is ever added, names an exact commit.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
